{% extends "superadmin/base.html" %}

{% block superadmin_content %}
<div class="card sa-card mx-auto" style="max-width: 760px;">
    <div class="card-body p-4 p-lg-5">
        <p class="text-uppercase small fw-semibold sa-muted mb-2">İletişim Başvurusu</p>
        <h2 class="h1 mb-3">{{ item_title }}</h2>
        <p class="fs-5 sa-muted mb-4">{{ confirm_message }}</p>

        <form method="post" class="d-flex flex-wrap gap-3">
            {% csrf_token %}
            <button class="btn rounded-pill px-4" type="submit" style="background:#b91c1c; color:#fff;">Kalıcı Olarak Sil</button>
            <a class="btn btn-outline-dark rounded-pill px-4" href="{{ cancel_url }}">Vazgeç</a>
        </form>
    </div>
</div>
{% endblock %}
